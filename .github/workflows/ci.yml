name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [v0.9.5, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y python3 poppler-utils fzf
      - name: Test reader, persistence, formats and fzf
        run: sh scripts/test.sh
